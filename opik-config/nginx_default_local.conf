# Opik frontend nginx config — proxies /api/* to the backend service.
# Fetched from: https://github.com/comet-ml/opik/tree/main/deployment/docker-compose

client_max_body_size 2G;
client_header_buffer_size 16k;
large_client_header_buffers 4 64k;

# Resolver re-resolves Docker DNS every 30s so nginx starts even if
# backend is not yet healthy.
resolver 127.0.0.11 valid=30s;
resolver_timeout 2s;

upstream backend {
    zone backend 64k;
    server backend:8080 resolve;
    keepalive 16;
}

server {
    listen 5173 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe used by Docker healthcheck / load balancers
    location /health {
        add_header Content-Type text/plain;
        access_log off;
        return 200 "healthy\n";
    }

    # Named location: rewrites /api/... → /... and proxies to backend
    location @api {
        rewrite /api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
        proxy_send_timeout 120;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Route /api/* to backend, everything else falls through to the SPA
    location /api/ {
        try_files /nonexistent @api;
    }

    # SPA fallback — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
